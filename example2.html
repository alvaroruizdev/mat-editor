function base64ToArrayBuffer(base64) {
  const binaryString = atob(base64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes.buffer;
}

// --- Environment: hand-painted equirectangular studio backdrop ---
// A plain neutral env (RoomEnvironment) reads as flat/grey through transmission.
// Painting large soft colour fields ourselves gives big, colourful reflections
// instead of tiny point-light glints, and keeps the base tone bright white.
function buildEnvironmentTexture() {
  const w = 2048;
  const h = 1024;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");

  // Bright, very slightly cool-white base (not pure #fff) so pure-white
  // highlights still have somewhere brighter to pop up FROM
  ctx.fillStyle = "#f3f3f7";
  ctx.fillRect(0, 0, w, h);

  // Sharper-edged blob: holds full saturation almost to the rim, then a quick
  // drop instead of a long soft fade -> reads as a distinct coloured zone
  // against plain white, not a diffuse tint.
  function blob(cx, cy, r, colorInner, colorOuter, alpha) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, colorInner);
    g.addColorStop(0.55, colorInner);
    g.addColorStop(0.72, colorOuter);
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function sparkle(cx, cy, r, alpha) {
    blob(cx, cy, r, "#ffffff", "#ffffff", alpha);
  }

  // Full ring of alternating saturated blue / purple-magenta fields spread
  // all the way around the panorama, at several heights, so EVERY viewing
  // angle (front, side, back) hits strong colour, not just left/right.
  const ring = [
    { x: 0.06, y: 0.3, c1: "#00d2ff", c2: "#0047ff", r: 0.24 },
    { x: 0.2, y: 0.62, c1: "#c400ff", c2: "#7a00e0", r: 0.22 },
    { x: 0.35, y: 0.22, c1: "#00d2ff", c2: "#0047ff", r: 0.2 },
    { x: 0.48, y: 0.58, c1: "#e000ff", c2: "#8f00ff", r: 0.26 },
    { x: 0.6, y: 0.22, c1: "#8f00ff", c2: "#4b00b0", r: 0.2 },
    { x: 0.72, y: 0.6, c1: "#00b4ff", c2: "#0047ff", r: 0.24 },
    { x: 0.86, y: 0.28, c1: "#e000ff", c2: "#7a00e0", r: 0.24 },
    { x: 0.98, y: 0.62, c1: "#00d2ff", c2: "#0047ff", r: 0.22 },
  ];
  for (const b of ring) {
    blob(w * b.x, h * b.y, w * b.r, b.c1, b.c2, 1.0);
  }

  // Sharp bright specular hotspots scattered around - small, pure white,
  // high contrast against the coloured/off-white base (the little glints
  // visible on real glass/liquid highlights).
  const hotspots = [
    [0.14, 0.16, 0.045],
    [0.4, 0.14, 0.05],
    [0.55, 0.42, 0.035],
    [0.66, 0.16, 0.04],
    [0.82, 0.5, 0.045],
    [0.92, 0.18, 0.035],
    [0.1, 0.48, 0.03],
    [0.3, 0.78, 0.04],
    [0.75, 0.82, 0.035],
  ];
  for (const [hx, hy, hr] of hotspots) {
    sparkle(w * hx, h * hy, w * hr, 1);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.mapping = THREE.EquirectangularReflectionMapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
}

const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();
const envEquirect = buildEnvironmentTexture();
const envRT = pmremGenerator.fromEquirectangular(envEquirect);
scene.environment = envRT.texture;
envEquirect.dispose();

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 6;
controls.target.set(0, 0, 0);

// --- Lights: mostly soft/white now that colour comes from the environment ---
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(2.5, 3, 2);
scene.add(keyLight);

const fillLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(fillLight);

// Small, sharp specular pops (kept subtle - the big colour now lives in the env map)
const blueRim = new THREE.PointLight(0xbfe6ff, 2.5, 10, 2);
blueRim.position.set(-1.6, 0.8, 1.4);
scene.add(blueRim);

const magentaRim = new THREE.PointLight(0xffb3ec, 2, 10, 2);
magentaRim.position.set(1.4, -0.6, 1.2);
scene.add(magentaRim);


// --- Glass / iridescent material ---
// Whiter, clearer base (almost no absorption tint) so colour reads purely from
// the big soft environment reflections/refractions, plus a stronger iridescent
// thin-film layer for larger, more saturated colour sweeps across the curves.
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x777,
  metalness: 0,
  roughness: 0.02,
  transmission: 1.0,
  thickness: 0.9,
  ior: 1.08,
  attenuationColor: new THREE.Color(0xffffff),
  attenuationDistance: 4.0,
  iridescence: 1.0,
  iridescenceIOR: 2.3,
  iridescenceThicknessRange: [200, 1100],
  clearcoat: 0.3,
  clearcoatRoughness: 0.015,
  specularIntensity: 1.0,
  specularColor: new THREE.Color(0xffffff),
  envMapIntensity: 2.1,
  transparent: true,
});

// --- Load the GLB ---
const loader = new GLTFLoader();
//loader.parse(
  //base64ToArrayBuffer(GLB_BASE64),
  //"",
loader.load(  
  'metaballs3.glb',
  (gltf) => {
    const model = gltf.scene;

    // Apply the glass material to every mesh in the model
    model.traverse((child) => {
      if (child.isMesh) {
        child.material = glassMaterial;
        child.castShadow = false;
        child.receiveShadow = false;
      }
    });

    // Center and normalize scale so it frames nicely regardless of source units
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    model.position.sub(center);

    const maxDim = Math.max(size.x, size.y, size.z);
    const targetSize = 1.6;
    const scale = targetSize / maxDim;
    model.scale.setScalar(scale);

    scene.add(model);
    loadingEl.style.opacity = "0";
    setTimeout(() => (loadingEl.style.display = "none"), 400);
  },
  (error) => {
    console.error("Error loading GLB:", error);
    loadingEl.textContent = "No se pudo cargar el modelo";
  }
);

// --- Resize handling ---
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
