<!doctype html>
<html lang="es">
<head>
    <link rel="icon" href="data:,">
<meta charset="utf-8">
<title>Editor de Materiales - Three.js + lil‑gui</title>
<style>
  body{margin:0;overflow:hidden}
  #canvas{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GUI } from 'lil-gui';

// --- 1. Renderizador y escena -------------------------------------------------
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas});
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);
scene.add(camera);

// Controles de órbita
const controls = new OrbitControls(camera, renderer.domElement);

// --- 2. Cargar modelo y materiales ------------------------------------------
const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.5,
  ior: 1.5,
  roughness: 0.5,
  metalness: 0.5
});

const iridMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.5,
  ior: 1.5,
  roughness: 0.5,
  metalness: 0.5
});
iridMat.iridescence = 0.5;
iridMat.iridescenceIOR = 1.4;

const chosen = { material: 'base' };

const loader = new GLTFLoader();
let modelMesh;
loader.load('metaballs.glb', gltf => {
  modelMesh = gltf.scene;
  const box = new THREE.Box3().setFromObject(modelMesh);
  const center = new THREE.Vector3();
  box.getCenter(center);
  modelMesh.position.sub(center);
  scene.add(modelMesh);
  
  if (modelMesh.children.length) {
    modelMesh.children.forEach(c => { 
      if (c.isMesh) c.material = chosen.material === 'base' ? material : iridMat; 
    });
  }
}, undefined, err => console.error(err));

// --- GUI PRINCIPAL ---
const gui = new GUI();

// --- 3. Sistema de Luces y Agrupación en Carpeta ------------------------------
const lights = [];
const lightFolders = [];
const lightGroup = new THREE.Group();
scene.add(lightGroup);

// Carpeta principal que agrupa TODAS las opciones de luces
const lightsMainFolder = gui.addFolder('Iluminación');

// Control de estado para los gizmos (checkbox)
const settings = {
  gizmosVisible: true,
  lightCount: 4
};

// Checkbox para activar/desactivar gizmos dentro de la carpeta de luces
lightsMainFolder.add(settings, 'gizmosVisible').name('Mostrar Gizmos').onChange(value => {
  lights.forEach(l => {
    if (l.helper) l.helper.visible = value;
  });
});

function createSpotLight(idx) {
  const l = new THREE.SpotLight(0xffffff, 2, 15, Math.PI / 6, 0.5, 1);
  const positions = [
    {x: -4, z: 4},
    {x: 4, z: 4},
    {x: 4, z: -4},
    {x: -4, z: -4}
  ];
  const p = positions[idx % positions.length];
  l.position.set(p.x, 3, p.z);
  
  l.target.position.set(0, 0, 0);
  scene.add(l.target);
  lightGroup.add(l);

  // SpotLightHelper profesional
  const helper = new THREE.SpotLightHelper(l, 0xffffff);
  helper.visible = settings.gizmosVisible; // Respeta el estado actual del checkbox
  scene.add(helper);
  l.helper = helper;

  // Esfera indicadora en el foco
  const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  l.add(sphere);

  return l;
}

function updateLightFolders() {
  // Limpiar carpetas anteriores de forma segura con .destroy()
  lightFolders.forEach(f => f.destroy());
  lightFolders.length = 0;

  lights.forEach((l, i) => {
    // AQUÍ ESTÁ LA CLAVE: Se añaden COMO HIJAS de `lightsMainFolder` (desplegable)
    const lf = lightsMainFolder.addFolder(`Luz ${i + 1}`);
    lf.addColor(l, 'color').onChange(() => { l.color.set(l.color); });
    lf.add(l, 'intensity', 0, 10).onChange(v => l.intensity = v);
    lf.add(l.position, 'x', -10, 10);
    lf.add(l.position, 'y', -10, 10);
    lf.add(l.position, 'z', -10, 10);
    lf.close(); // Se cierran por defecto para que esté ordenado
    lightFolders.push(lf);
  });
}

function adjustLights(count) {
  while (lights.length > count) {
    const l = lights.pop();
    lightGroup.remove(l);
    if (l.helper) {
      scene.remove(l.helper);
      l.helper.dispose();
    }
  }
  while (lights.length < count) {
    lights.push(createSpotLight(lights.length));
  }
  updateLightFolders();
}

// Slider para cambiar la cantidad de luces de 1 a 10 dentro de la carpeta
lightsMainFolder.add(settings, 'lightCount', 1, 10, 1).name('Cantidad de luces').onChange(v => adjustLights(v));

lightsMainFolder.open();

// Inicializar con 4 luces por defecto
adjustLights(4);

// --- 4. Controles de Materiales ---------------------------------------------
const matFolder = gui.addFolder('Base Material');
matFolder.addColor(material, 'color');
matFolder.add(material, 'transmission', 0, 1);
matFolder.add(material, 'ior', 1, 3);
matFolder.add(material, 'roughness', 0, 1);
matFolder.add(material, 'metalness', 0, 1);
matFolder.close();

const iridFolder = gui.addFolder('Iridiscente Mat');
iridFolder.addColor(iridMat, 'color');
iridFolder.add(iridMat, 'iridescence', 0, 1);
iridFolder.add(iridMat, 'iridescenceIOR', 1, 3);
iridFolder.add(iridMat, 'roughness', 0, 1);
iridFolder.add(iridMat, 'metalness', 0, 1);
iridFolder.close();

const materialFolder = gui.addFolder('MATERIAL ELEGIDO');
materialFolder.add(chosen, 'material', ['base', 'iridiscente']).onChange(v => {
  if (modelMesh && modelMesh.children) {
    modelMesh.children.forEach(c => { 
      if (c.isMesh) c.material = v === 'base' ? material : iridMat; 
    });
  }
});
materialFolder.open();

// --- 5. Bucle de Animación --------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  if (modelMesh) modelMesh.rotation.y += 0.005;
  
  lights.forEach(l => { 
    if (l.helper && typeof l.helper.update === 'function') {
      l.helper.update(); 
    }
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

// --- 6. Redimensionar ventana -----------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
