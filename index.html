<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de Materiales - Three.js + lil‑gui</title>
<style>
  body{margin:0;overflow:hidden}
  #canvas{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Three.js (latest) -->
<!-- <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<!-- lil‑gui -->
<!-- <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18.0/dist/lil-gui.min.js"></script> --> 
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.min.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GUI } from 'lil-gui';

// --- 1. Renderizador y escena -------------------------------------------------
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas});
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);
scene.add(camera);

// --- 2. Modelo de prueba ------------------------------------------------------
const geometry = new THREE.IcosahedronGeometry(1, 2);
// Base material – only properties that exist in r152
const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.5,
  ior: 1.5,
  roughness: 0.5,
  metalness: 0.5
});
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// --- 3. Luz ---------------------------------------------------------------
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

// --- 4. GUI ---------------------------------------------------------------
const gui = new GUI();

const matFolder = gui.addFolder('Base Material');
matFolder.addColor(material, 'color').onChange(()=>{material.needsUpdate = true;});
matFolder.add(material, 'transmission', 0, 1).onChange(()=>{material.needsUpdate = true;});
matFolder.add(material, 'ior', 1, 3).onChange(()=>{material.needsUpdate = true;});
matFolder.add(material, 'roughness', 0, 1).onChange(()=>{material.needsUpdate = true;});
matFolder.add(material, 'metalness', 0, 1).onChange(()=>{material.needsUpdate = true;});
matFolder.open();

// --- 5. Iridiscente (ejemplo) ----------------------------------------------
// Iridiscente example – add custom properties on the object
const iridMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.5,
  ior: 1.5,
  roughness: 0.5,
  metalness: 0.5
});
iridMat.iridiscence = 0.5;
iridMat.iridiscenceIOR = 1.4;

const iridFolder = gui.addFolder('Iridiscente Mat');
iridFolder.addColor(iridMat, 'color').onChange(()=>{iridMat.needsUpdate = true;});
iridFolder.add(iridMat, 'iridiscence', 0, 1).onChange(()=>{iridMat.needsUpdate = true;});
iridFolder.add(iridMat, 'iridiscenceIOR', 1, 3).onChange(()=>{iridMat.needsUpdate = true;});
iridFolder.add(iridMat, 'roughness', 0, 1).onChange(()=>{iridMat.needsUpdate = true;});
iridFolder.add(iridMat, 'metalness', 0, 1).onChange(()=>{iridMat.needsUpdate = true;});
iridFolder.open();

// --- 6. Animación ------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  mesh.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();

// --- 7. Ajustar tamaño al redimensionar --------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
